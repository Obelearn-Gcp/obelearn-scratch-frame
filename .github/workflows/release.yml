name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - uses: actions/cache@v4
        with:
          path: .cache/library-assets
          key: library-assets-${{ hashFiles('package-lock.json') }}

      - run: npm run fetch-assets

      - run: npm run build

      - name: Package build and source
        run: |
          cd build && zip -qr "../scratch-frame-${GITHUB_REF_NAME}.zip" . && cd ..
          git archive --format=zip -o "scratch-frame-${GITHUB_REF_NAME}-source.zip" HEAD

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            "scratch-frame-${GITHUB_REF_NAME}.zip" \
            "scratch-frame-${GITHUB_REF_NAME}-source.zip" \
            --title "${GITHUB_REF_NAME}" \
            --notes "Static Scratch frame build. Extract into the ObeLearn frontend at public/scratch-gui/."
